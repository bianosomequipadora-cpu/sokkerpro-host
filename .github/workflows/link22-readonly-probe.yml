name: Link22 Readonly Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests cryptography
      - name: Read M4 link22 for reported fixture only
        run: |
          python - <<'PY'
          import re
          import bot_sokkerpro as bot
          target = '19896563'
          data = bot._get_data()
          assert data, 'M4 live feed unavailable'
          fixtures=[]
          for category in data['data']['sortedCategorizedFixtures']:
              fixtures.extend(category.get('fixtures', []))
          matches=[f for f in fixtures if str(f.get('fixtureId')) == target]
          print(f'FEED_FIXTURE_COUNT={len(matches)}')
          for f in matches:
              link22=f.get('link22')
              match=re.search(r'%2FFootball%2F([^&]+)', str(link22 or ''), re.IGNORECASE)
              path=bot.unquote(match.group(1)) if match else ''
              print(f'FEED_STATUS={f.get("status")}')
              print(f'FEED_TEAMS={f.get("localTeamName")} x {f.get("visitorTeamName")}')
              print(f'LINK22_PRESENT={link22 is not None and str(link22)!=""}')
              print(f'LINK22_RAW={link22!r}')
              print(f'REGEX_MATCH={bool(match)}')
              print(f'EXTRACTED_PARIPESA_PATH={path!r}')
          detail=bot._buscar_detalhe_fixture(target)
          print(f'DETAIL_FOUND={bool(detail)}')
          if detail:
              print(f'DETAIL_FIXTURE_ID={detail.get("fixtureId")}')
              print(f'DETAIL_LINK22={detail.get("link22")!r}')
          PY
