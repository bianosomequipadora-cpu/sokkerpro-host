name: M4 Fixture Readonly Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests cryptography
      - name: One handshake, one livescores request, and fixture detail reads
        run: |
          python - <<'PY'
          import json, socket
          import requests
          from urllib3.util import connection as urllib3_connection
          from sokkerpro_m4_session import M4Error, M4Session, is_auth_rejection

          urllib3_connection.allowed_gai_family = lambda: socket.AF_INET
          base = 'https://m4.sokkerpro.com'
          session = requests.Session()
          session.headers.update({
              'Accept': 'application/json, text/plain, */*',
              'Origin': 'https://sokkerpro.com',
              'Referer': 'https://sokkerpro.com/',
              'User-Agent': 'sokkerpro-monitor/0.1',
          })
          m4 = M4Session(base)

          def post_json(url, payload):
              response = session.post(url, json=payload, timeout=20)
              response.raise_for_status()
              return response.json()

          def unwrap(payload):
              root = payload
              for _ in range(3):
                  if isinstance(root, dict) and isinstance(root.get('data'), dict):
                      root = root['data']
                      if isinstance(root.get('content'), str):
                          content = root['content']
                          start = content.find('{')
                          if start >= 0:
                              root = json.loads(content[start:])
                          else:
                              break
                  else:
                      break
              return root

          m4.handshake(post_json)
          print('M4_DETAIL_PROBE handshake=OK')

          live_ids = []
          url = base + '/livescores'
          response = session.get(url, headers=m4.headers_for('GET', url), timeout=20)
          print(f'M4_DETAIL_PROBE livescores_http={response.status_code} cf_ray={response.headers.get("CF-Ray", "none")}')
          response.raise_for_status()
          live_root = unwrap(m4.decrypt(response.json()))
          if isinstance(live_root, dict):
              for category in live_root.get('sortedCategorizedFixtures', []):
                  if not isinstance(category, dict):
                      continue
                  for fixture in category.get('fixtures', []):
                      if isinstance(fixture, dict) and fixture.get('fixtureId'):
                          live_ids.append((str(fixture['fixtureId']), fixture.get('status'), fixture.get('localTeamName'), fixture.get('visitorTeamName')))
          elif isinstance(live_root, list):
              for fixture in live_root:
                  if isinstance(fixture, dict) and fixture.get('fixtureId'):
                      live_ids.append((str(fixture['fixtureId']), fixture.get('status'), fixture.get('localTeamName'), fixture.get('visitorTeamName')))
          print(f'M4_DETAIL_PROBE livescore_fixture_count={len(live_ids)}')

          chosen = []
          for item in live_ids:
              status = str(item[1] or '').upper()
              if status not in ('FT', 'PEN', 'NS', 'CANCELLED', 'POSTPONED'):
                  chosen.append(item)
                  break
          targets = chosen + [(fid, 'audit-case', '', '') for fid in ('19766419', '19668082')]
          seen = set()
          for fid, status, home, away in targets:
              if fid in seen:
                  continue
              seen.add(fid)
              detail_url = base + '/fixture/' + fid
              detail_response = session.get(detail_url, headers=m4.headers_for('GET', detail_url), timeout=20)
              print(f'M4_DETAIL_PROBE fixture_id={fid} http={detail_response.status_code} cf_ray={detail_response.headers.get("CF-Ray", "none")} source_status={status}')
              if not detail_response.ok:
                  continue
              detail = unwrap(m4.decrypt(detail_response.json()))
              if not isinstance(detail, dict) or is_auth_rejection(detail):
                  print(f'M4_DETAIL_PROBE fixture_id={fid} decoded_shape={type(detail).__name__} auth_rejection={is_auth_rejection(detail)}')
                  continue
              fields = ('fixtureId', 'localTeamName', 'visitorTeamName', 'status', 'minute', 'scoresLocalTeam', 'scoresVisitorTeam', 'scoresHT', 'localCornersHT', 'visitorCornersHT', 'localCorners', 'visitorCorners')
              summary = {key: detail.get(key) for key in fields if key in detail}
              needed = ('scoresHT', 'localCornersHT', 'visitorCornersHT', 'localCorners', 'visitorCorners')
              print(f'M4_DETAIL_PROBE fixture_id={fid} decoded_shape=dict top_keys={len(detail)} fields={json.dumps(summary, ensure_ascii=False)} required_fields_present={json.dumps({key: key in detail and detail[key] is not None for key in needed})}')
          print('M4_DETAIL_PROBE complete=OK no_retries=true no_telegram=true')
          PY
