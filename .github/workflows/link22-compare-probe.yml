name: Link22 Compare Readonly Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests cryptography
      - name: Compare M4 links for the two matches
        run: |
          python - <<'PY'
          import re, json
          import bot_sokkerpro as bot
          data=bot._get_data()
          assert data, 'M4 live feed unavailable'
          fixtures=[]
          for category in data['data']['sortedCategorizedFixtures']:
              fixtures.extend(category.get('fixtures', []))
          selected=[]
          for f in fixtures:
              home=str(f.get('localTeamName',''))
              away=str(f.get('visitorTeamName',''))
              pair=(home+' '+away).lower()
              if (str(f.get('fixtureId'))=='19896563' or
                  ('bangalore city' in pair and 'agniputhra' in pair) or
                  ('yokohama' in pair and 'urawa' in pair)):
                  selected.append(f)
          print('MATCHES_FOUND='+str(len(selected)))
          for f in selected:
              fid=str(f.get('fixtureId'))
              print('--- FIXTURE ---')
              print('FIXTURE_ID='+fid)
              print('TEAMS='+str(f.get('localTeamName'))+' x '+str(f.get('visitorTeamName')))
              print('LEAGUE='+str(f.get('leagueName')))
              print('STATUS='+str(f.get('status')))
              for k,v in f.items():
                  if 'link' in str(k).lower() or 'url' in str(k).lower():
                      print('URL_FIELD_'+str(k)+'='+repr(v))
              raw=f.get('link22')
              m=re.search(r'%2FFootball%2F([^&]+)',str(raw or ''),re.I)
              path=bot.unquote(m.group(1)) if m else ''
              print('LINK22_PRESENT='+str(raw is not None and str(raw)!=''))
              print('REGEX_MATCH='+str(bool(m)))
              print('EXTRACTED_PATH='+repr(path))
              detail=bot._buscar_detalhe_fixture(fid)
              print('DETAIL_FOUND='+str(bool(detail)))
              if detail:
                  for k,v in detail.items():
                      if 'link' in str(k).lower() or 'url' in str(k).lower():
                          print('DETAIL_URL_FIELD_'+str(k)+'='+repr(v))
          PY
