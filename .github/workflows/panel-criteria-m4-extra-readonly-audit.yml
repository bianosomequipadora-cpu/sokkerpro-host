name: Panel Criteria M4 Extra Readonly Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests cryptography
      - name: Audit criterion catalog, evaluator, and real M4 fixtures (no writes)
        run: |
          python - <<'PY'
          import ast, json, re
          from pathlib import Path
          import bot_sokkerpro as bot

          panel_text = Path('painel.html').read_text(encoding='utf-8')
          catalog = json.loads(re.search(r'var API_CRITERIA_CATALOG=(\[.*?\]);\s*API_CRITERIA_CATALOG\.sort', panel_text, re.S).group(1))
          operators = ast.literal_eval(re.search(r'var API_OPS=(\[.*?\]);', panel_text, re.S).group(1))
          panel_keys = [x[2] for x in catalog]
          assert len(panel_keys) == len(set(panel_keys))

          source_text = Path('bot_sokkerpro.py').read_text(encoding='utf-8')
          tree = ast.parse(source_text)
          extract_fn = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == '_extrair_stats_sokkerpro')
          extract_return = next(n for n in ast.walk(extract_fn) if isinstance(n, ast.Return) and isinstance(n.value, ast.Dict))
          stats_exprs = {}
          stats_keys = set()
          for key_node, value_node in zip(extract_return.value.keys, extract_return.value.values):
              if not isinstance(key_node, ast.Constant):
                  continue
              stat_key = key_node.value
              stats_keys.add(stat_key)
              sources = []
              for call in ast.walk(value_node):
                  if isinstance(call, ast.Call) and isinstance(call.func, ast.Name) and call.func.id in ('g', 'gf', '_corners') and call.args and isinstance(call.args[0], ast.Constant) and isinstance(call.args[0].value, str):
                      sources.append(call.args[0].value)
              stats_exprs[stat_key] = list(dict.fromkeys(sources))

          run_fn = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'run_ciclo')
          validator_node = next(n for n in ast.walk(run_fn) if isinstance(n, ast.FunctionDef) and n.name == '_validar_criterios_gerais')
          api_map = {}
          special = set()
          for node in ast.walk(validator_node):
              if isinstance(node, ast.Assign) and isinstance(node.value, ast.Dict) and any(isinstance(t, ast.Name) and t.id == 'api_map' for t in node.targets):
                  api_map = {ast.literal_eval(k): ast.literal_eval(v) for k, v in zip(node.value.keys, node.value.values)}
              if isinstance(node, ast.Compare) and isinstance(node.left, ast.Name) and node.left.id == 'campo':
                  for comp in node.comparators:
                      if isinstance(comp, ast.Constant) and isinstance(comp.value, str):
                          special.add(comp.value)
          eval_globals = {'CONFIG_MERCADOS': {}, 'm': 55, 'red_fav': 0, 'sh': 0, 'sa': 0, 'odd_h': 2.0, 'odd_a': 3.0}
          exec(compile(ast.Module(body=[validator_node], type_ignores=[]), 'bot_sokkerpro.py', 'exec'), eval_globals)
          validate = eval_globals['_validar_criterios_gerais']

          def route_for(key):
              if key in api_map: return 'api_map'
              if key in special: return 'special'
              if key in stats_keys: return 'direct_stats'
              if key.startswith('prob_'): return 'prob_mercados'
              return 'missing'

          routes = {key: route_for(key) for key in panel_keys}
          missing_routes = [key for key, route in routes.items() if route == 'missing']
          assert not missing_routes, f'catalog fields without evaluator route: {missing_routes}'
          supported_ops = {'gte', 'lte', 'gt', 'lt', 'eq', 'between'}
          assert all(op[0] in supported_ops for op in operators)
          config = json.loads(Path('config.json').read_text(encoding='utf-8'))
          markets = config.get('mercados', {})
          configured = {item.get('campo') for market in markets.values() for item in market.get('criterios_api', []) if item.get('campo')}
          unknown_configured = sorted(configured - set(panel_keys))
          assert not unknown_configured, f'configured fields absent from panel catalog: {unknown_configured}'
          print(f'PANEL_CATALOG total={len(panel_keys)} unique={len(set(panel_keys))} routes={len(routes)} missing_routes={len(missing_routes)} operators={len(operators)}')
          print(f'SAVED_CONFIG markets={len(markets)} api_rows={sum(len(m.get("criterios_api", [])) for m in markets.values())} unique_api_fields={len(configured)} unknown_fields={len(unknown_configured)}')

          # Confirm the semantic label of APPM total against the evaluator's reducer.
          appm_key = 'appm_total_min'
          appm_label = next(label for _, label, key in catalog if key == appm_key)
          eval_globals['CONFIG_MERCADOS'] = {'__appm_probe__': {'criterios': {}, 'criterios_api': [{'campo': appm_key, 'operador': 'gte', 'valor': 15}]}}
          appm_ok, appm_reasons = validate('__appm_probe__', {'dapm_total_h': 12, 'dapm_total_a': 8}, 'h')
          appm_semantic_mismatch = not appm_ok
          print(f'APPM_TOTAL_CHECK label={appm_label!r} reducer={api_map[appm_key][2]} example_sum=20 outcome={"pass" if appm_ok else "fail"} mismatch={appm_semantic_mismatch}')

          # Obtain real live M4 fixtures, test get_stats_sokkerpro's production path,
          # and measure actual source-field availability across a small live sample.
          data = bot._get_data()
          assert data, 'M4 livescores unavailable'
          live_fixtures = []
          for category in data['data']['sortedCategorizedFixtures']:
              live_fixtures.extend(category.get('fixtures', []))
          live_fixtures = [f for f in live_fixtures if f.get('fixtureId') is not None][:12]
          assert live_fixtures, 'No live M4 fixtures returned'
          samples = []
          original_detail = bot._buscar_detalhe_fixture
          for live_fixture in live_fixtures:
              fid = str(live_fixture['fixtureId'])
              captured = {}
              def capture_detail(requested_id):
                  result = original_detail(requested_id)
                  captured[str(requested_id)] = result
                  return result
              bot._buscar_detalhe_fixture = capture_detail
              stats = bot.get_stats_sokkerpro(fid)
              bot._buscar_detalhe_fixture = original_detail
              detail = captured.get(fid)
              assert isinstance(stats, dict) and isinstance(detail, dict), f'M4 stats/detail missing for {fid}'
              assert str(detail.get('fixtureId')) == fid
              odds_h, odds_a = bot.get_odds_sokkerpro(fid)
              fav = 'h' if odds_h is None or odds_a is None or odds_h <= odds_a else 'a'
              minute = bot._get_int(live_fixture.get('minute', 0)) or bot._get_int(live_fixture.get('minutePrimeiroTempo', 0)) or bot._get_int(live_fixture.get('minuteSegundoTempo', 0))
              sh = bot._get_int(live_fixture.get('scoresLocalTeam', 0))
              sa = bot._get_int(live_fixture.get('scoresVisitorTeam', 0))
              eval_globals.update({'CONFIG_MERCADOS': {}, 'm': minute, 'sh': sh, 'sa': sa, 'odd_h': odds_h, 'odd_a': odds_a, 'red_fav': stats.get('red_cards_h' if fav == 'h' else 'red_cards_a', 0)})
              samples.append((fid, live_fixture, detail, stats, fav))
              print(f'M4_SAMPLE id={fid} status={detail.get("status")} detail_keys={len(detail)} odds={len(stats.get("odds_mercados", {}))} minuto={minute}')
          bot._buscar_detalhe_fixture = original_detail

          def has_value(raw, key):
              if key not in raw: return False
              value = raw.get(key)
              return value is not None and not (isinstance(value, str) and value.strip().lower() in ('', 'x', 'none'))

          def source_ok(key, raw, stats, fav, odds):
              if key == 'appm_partida_calc':
                  minute = bot._get_int(raw.get('minute', 0)) or bot._get_int(raw.get('minutePrimeiroTempo', 0)) or bot._get_int(raw.get('minuteSegundoTempo', 0))
                  return stats_source('ataques_perigosos_h', raw, stats) and stats_source('ataques_perigosos_a', raw, stats) and minute > 0
              if key == 'btts_probabilidade_min':
                  return prog_path(raw, ('mercado_ambos_marcam','ambos_sim','probabilidade'))
              if key == 'odd_favorito_max':
                  return odds[0] is not None and odds[1] is not None
              if key == 'diferenca_gols_fav_max':
                  return has_value(raw, 'scoresLocalTeam') and has_value(raw, 'scoresVisitorTeam')
              if key == 'max_red_card_fav':
                  return stats_source('red_cards_h' if fav == 'h' else 'red_cards_a', raw, stats)
              if key == 'chutes_bloq_fav':
                  return stats_source('chutes_bloq_h' if fav == 'h' else 'chutes_bloq_a', raw, stats)
              if key.startswith('prob_'):
                  return key[5:] in stats.get('prob_mercados', {}) and stats.get('prob_mercados', {}).get(key[5:]) is not None
              if key in api_map:
                  base, _, side = api_map[key]
                  fields = [f'{base}_{fav}'] if side == 'fav' else [f'{base}_h', f'{base}_a'] if side in ('sum','max') else [f'{base}_{side}']
                  return all(stats_source(field, raw, stats) for field in fields)
              prog_paths = {
                  'media_gols_ht_h': ('mercado_gols_primeiro_tempo','over_0_5','detalhes','media_casa_pt'),
                  'media_gols_ht_a': ('mercado_gols_primeiro_tempo','over_0_5','detalhes','media_fora_pt'),
                  'media_gols_ft_h': ('mercado_gols','over_0_5','detalhes','media_casa'),
                  'media_gols_ft_a': ('mercado_gols','over_0_5','detalhes','media_fora'),
              }
              if key in prog_paths:
                  return prog_path(raw, prog_paths[key])
              return stats_source(key, raw, stats)

          def stats_source(stat_key, raw, stats):
              src = stats_exprs.get(stat_key, [])
              if src: return all(has_value(raw, field) for field in src)
              return stat_key in stats and stats.get(stat_key) is not None

          def prog_path(raw, path):
              try:
                  prog = json.loads(raw.get('prognosticos') or '{}') if isinstance(raw.get('prognosticos'), str) else raw.get('prognosticos') or {}
                  for part in path:
                      prog = prog.get(part) if isinstance(prog, dict) else None
                  return prog is not None and prog != ''
              except Exception:
                  return False

          seen_source = {key: False for key in panel_keys}
          evaluator_numeric = {key: False for key in panel_keys}
          evaluator_errors = []
          active_fields_seen = {key: False for key in configured}
          active_missing_reasons = set()
          actual_market_runs = 0
          for fid, live_fixture, detail, stats, fav in samples:
              odds = bot.get_odds_sokkerpro(fid)
              eval_globals.update({'m': bot._get_int(live_fixture.get('minute', 0)) or bot._get_int(live_fixture.get('minutePrimeiroTempo', 0)) or bot._get_int(live_fixture.get('minuteSegundoTempo', 0)), 'sh': bot._get_int(live_fixture.get('scoresLocalTeam', 0)), 'sa': bot._get_int(live_fixture.get('scoresVisitorTeam', 0)), 'odd_h': odds[0], 'odd_a': odds[1], 'red_fav': stats.get('red_cards_h' if fav == 'h' else 'red_cards_a', 0)})
              for key in panel_keys:
                  eval_globals['CONFIG_MERCADOS'] = {'__field_probe__': {'criterios': {}, 'criterios_api': [{'campo': key, 'operador': 'gte', 'valor': -1e30}]}}
                  try:
                      ok, reasons = validate('__field_probe__', stats, fav)
                      if ok: evaluator_numeric[key] = True
                  except Exception as exc:
                      evaluator_errors.append((key, type(exc).__name__))
                  if source_ok(key, detail, stats, fav, odds): seen_source[key] = True
              eval_globals['CONFIG_MERCADOS'] = markets
              for market_name in markets:
                  try:
                      validate(market_name, stats, fav)
                      actual_market_runs += 1
                  except Exception as exc:
                      evaluator_errors.append((market_name, type(exc).__name__))
              for key in configured:
                  if source_ok(key, detail, stats, fav, odds): active_fields_seen[key] = True
                  else: active_missing_reasons.add(key)

          source_count = sum(seen_source.values())
          numeric_count = sum(evaluator_numeric.values())
          missing_catalog = [key for key in panel_keys if not seen_source[key]]
          missing_active = sorted(key for key in configured if not active_fields_seen[key])
          print(f'RUNTIME_SAMPLE fixtures={len(samples)} catalog_with_real_source={source_count}/{len(panel_keys)} evaluator_numeric_at_least_once={numeric_count}/{len(panel_keys)} evaluator_exceptions={len(evaluator_errors)} configured_market_evaluations={actual_market_runs}')
          print(f'ACTIVE_FIELDS_SOURCE_MISSING_IN_SAMPLE count={len(missing_active)} fields={missing_active}')
          print(f'CATALOG_FIELDS_NOT_OBSERVED_IN_SAMPLE count={len(missing_catalog)} fields={missing_catalog}')
          print(f'CRITERIA_AUDIT complete=PASS no_telegram=true no_config_writes=true')
          PY
