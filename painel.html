function doLogin() {
    var t = document.getElementById('token-field').value.trim();
    if(!t) { alert('Informe o token do GitHub para continuar.'); return; }
    localStorage.setItem('github_token', t);
    TOKEN = t;
    checkLogin();

function st(txt,cl){ var s=document.getElementById('status'); if(!s)return; s.innerHTML=txt; s.style.color=cl==='ok'?'#2ecc71':(cl==='err'?'#e74c3c':'#f1c40f'); }

function gv(id) {
    var el=document.getElementById(id);
    if(!el) return null;
    if(el.type==='checkbox') return el.checked;
    if(el.type==='text') return el.value||'';
    if(el.type==='select-one') return el.value||'';
    var raw=el.value.trim();
    if(raw==='') return null;
    var v=parseFloat(raw.replace(',','.'));
    return Number.isFinite(v)?v:null;
}

var ENTRADAS_REPO = "sokkerpro-host";
async function abrirEntradas(mercado){
    var modal=document.getElementById("entradas-modal");
    if(!modal){ modal=document.createElement("div"); modal.id="entradas-modal"; modal.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;padding:18px;overflow:auto"; document.body.appendChild(modal); }
    modal.innerHTML='<div style="max-width:760px;margin:auto;background:#151525;border-radius:14px;padding:16px"><button onclick="document.getElementById(\'entradas-modal\').remove()" style="float:right;background:#e74c3c;color:#fff;border:0;border-radius:8px;padding:7px 12px">Fechar</button><h2 style="margin-bottom:14px">Entradas</h2><div style="display:flex;align-items:center;gap:8px;margin:12px 0"><span style="font-size:1.25em">🔍</span><input id="entradas-busca" type="search" placeholder="Digite o nome do jogo ou time..." style="flex:1;padding:11px;border-radius:9px;border:1px solid #555;background:#222;color:#fff"></div><div id="entradas-list">Carregando...</div></div>';
    try{
      var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/entradas.json?x='+Date.now(),{headers:{}});
      var list=[]; if(r.ok){var j=await r.json();list=JSON.parse(decodeURIComponent(escape(atob(j.content))));}
      list=list.filter(function(x){return x.mercado===mercado;}).reverse();
      var el=document.getElementById('entradas-list');
      var busca=document.getElementById('entradas-busca');
      function renderEntradas(){
        var termo=(busca.value||'').toLowerCase().trim();
        var filtradas=list.filter(function(x){return !termo || ((x.home||'')+' '+(x.away||'')).toLowerCase().includes(termo);});
        if(!filtradas.length){el.innerHTML='<p>Nenhuma entrada encontrada.</p>';return;}
        el.innerHTML=filtradas.map(function(x){var dt=x.timestamp?new Date(x.timestamp).toLocaleString('pt-BR'):'';var cor=x.resultado==='green'?'#2ecc71':(x.resultado==='red'?'#e74c3c':'#f1c40f');return '<div style="border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:11px;margin:8px 0"><b>'+ (x.home||'')+' x '+(x.away||'')+'</b><br><small>'+dt+'</small><br><span style="color:'+cor+';font-weight:bold">'+String(x.resultado||'pendente').toUpperCase()+'</span></div>';}).join('');
      }
      busca.addEventListener('input',renderEntradas);
      renderEntradas();
    }catch(e){document.getElementById('entradas-list').innerHTML='<p>Não foi possível carregar as entradas.</p>';}
}

async function carregarDoGitHub(){
    st("Carregando dados...","loading");
    try{
        var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/config.json',{headers:{}});
        if(r.ok){
            var j=await r.json();
            cfgSha=j.sha;
            var decoded=decodeURIComponent(escape(atob(j.content)));
            var configReal=JSON.parse(decoded);
            CONFIG_INLINE=configReal;
            st("Dados carregados!","ok");
            await carregarPerformance();
        } else {
            st("Erro ao buscar dados: "+r.status,"err");
        }
    }catch(e){
        st("Erro de conexao: "+e.message,"err");
    }
    renderizarMercados();
}

function renderizarMercados(){
    var merc=CONFIG_INLINE.mercados||{};
    var container=document.getElementById('custom-markets-container');
    container.innerHTML='';
    for(var k in merc){container.appendChild(criarCardMercado(k,merc[k],k.startsWith('custom_')));}
}

async function salvarConfig(){
    if(!TOKEN){
        var novoToken=prompt('Para salvar alterações, informe seu token do GitHub:');
        if(!novoToken){st('Token do GitHub necessario!','err');return;}
        TOKEN=novoToken.trim();
        localStorage.setItem('github_token',TOKEN);
    }
    st('Salvando...','loading');
    try{
        var merc={};
        document.querySelectorAll('.card').forEach(function(card){
            var key=card.id.replace('card-','');
            var criterios={};
            card.querySelectorAll('input[type="number"]').forEach(function(campo){
                var bruto=campo.value.trim();
                if(bruto!=='' && !/^[+-]?(?:\d+)(?:[.,]\d+)?$/.test(bruto)) throw new Error('Valor inválido no campo numérico '+campo.id+'. Use apenas números.');
            });
            function addIf(keyC, idSuf){var v=gv(key+'-'+idSuf); if(v!==null&&v!=='')criterios[keyC]=v;}
            addIf('situacao_favorito','sit-fav');
                        addIf('appm_min_por_time','appm');
            addIf('appm_total_min','appm-total');
            addIf('media_gols_partida_min','media-gols');
            addIf('media_gols_ht_min','media-gols-ht');
            addIf('media_gols_ft_min','media-gols-ft');
            addIf('btts_probabilidade_min','btts-prob');
                                                addIf('diferenca_gols_fav_max','diff-gols');
            addIf('chutes_alvo_min','chutes-alvo');
            addIf('chutes_totais_min','chutes-tot');
            addIf('ataques_perigosos_min','atq-perig');
            addIf('escanteios_minimos','esc-min');
            addIf('max_red_card_fav','red-max');
            addIf('posse_bola_min','posse');
                        addIf('media_corners_total_min','media-corners');
            addIf('media_corners_casa_min','media-corners-casa');
            addIf('media_corners_fora_min','media-corners-fora');
            addIf('xg_total_min','xg-total');
            addIf('xg_casa_min','xg-casa');
            addIf('xg_fora_min','xg-fora');
            addIf('pressure_bar_min','pressure');
            addIf('chutes_inside_min','chutes-inside');
            addIf('chutes_outside_min','chutes-outside');
            addIf('goal_attempts_min','goal-attempts');
            addIf('chutes_bloq_max','chutes-bloq');
            addIf('defesas_min','defesas');
            addIf('faltas_min','faltas');
            addIf('yellow_max','yellow');
            addIf('impedimentos_min','impedimentos');
            addIf('dapm_5_min','dapm5');
            addIf('dapm_total_orig_min','dapm-total-orig');
            addIf('ball_safe_min','ball-safe');
            
            var sit=document.getElementById(key+'-sit-fav');
            if(sit) criterios.situacao_favorito=sit.value;
            
            var tipoEl=document.getElementById(key+'-tipo');
            var tipoVal=tipoEl?tipoEl.value:'';

            function inteiroObrigatorio(sufixo, rotulo){
                var campo=document.getElementById(key+'-'+sufixo);
                var bruto=campo ? campo.value.trim() : '';
                if(bruto==='') throw new Error('Preencha '+rotulo+' do mercado '+key+'.');
                if(!/^[-+]?\d+$/.test(bruto)) throw new Error(rotulo+' inválida no mercado '+key+'. Use um número inteiro.');
                return Number(bruto);
            }
            var minutoInicio=inteiroObrigatorio('inicio','minutagem inicial');
            var minutoFim=inteiroObrigatorio('fim','minutagem final');
            var periodo=inteiroObrigatorio('periodo','período');
            if(minutoInicio<0 || minutoFim<0 || minutoInicio>minutoFim) throw new Error('Minutagem inválida no mercado '+key+'. Confira início e fim.');
            if(periodo!==1 && periodo!==2) throw new Error('Período inválido no mercado '+key+'. Use 1 para HT ou 2 para FT.');
            merc[key]={
                ativo:gv(key+'-ativo'),
                notificar:gv(key+'-notificar'),
                nome:(document.getElementById(key+'-nome')||{}).value||'',
                minuto_inicio:minutoInicio,
                minuto_fim:minutoFim,
                periodo:periodo,
                tipo:tipoVal,
                placar_valido:gv(key+'-placar-valido'),
                criterios:criterios
            };
        });
        var fullConfig=JSON.parse(JSON.stringify(CONFIG_INLINE));
        fullConfig.mercados=merc;
        
        // Tenta salvar com retry automatico em caso de conflito de SHA
        var maxTentativas=5;
        var tentativa=0;
        var sucesso=false;
        while(tentativa<maxTentativas && !sucesso){
            tentativa++;
            var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/config.json?t='+Date.now(),{
                headers:{'Authorization':'Bearer '+TOKEN}
            });
            if(!r.ok){throw new Error('Falha ao buscar SHA (tentativa '+tentativa+')');}
            var j=await r.json();
            var b64=btoa(unescape(encodeURIComponent(JSON.stringify(fullConfig,null,2))));
            var res=await fetch('https://api.github.com/repos/'+REPO+'/contents/config.json',{
                method:'PUT',
                headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'},
                body:JSON.stringify({message:'Painel: ajuste de mercados [skip ci]',content:b64,sha:j.sha})
            });
            if(res.ok){
                sucesso=true;
                var j2=await res.json();
                if(j2.content&&j2.content.sha){cfgSha=j2.content.sha;}
                CONFIG_INLINE.mercados=merc;
                st('SALVO COM SUCESSO!','ok');
            } else {
                var errMsg='';
                try{var ej=await res.json(); errMsg=ej.message||'';}catch(ex){}
                if(tentativa<maxTentativas && (errMsg.indexOf('sha')>=0 || res.status===409)){
                    await new Promise(r2=>setTimeout(r2,1000));
                } else {
                    throw new Error(errMsg||'Erro GitHub na tentativa '+tentativa);
                }
            }
        }
        if(!sucesso){throw new Error('Falha apos '+maxTentativas+' tentativas');}
    }catch(e){st('ERRO: '+e.message,'err');}
}

async function carregarPerformance(){
    try{
        var mercados=CONFIG_INLINE.mercados||{};

        var rp=await fetch('https://api.github.com/repos/'+REPO+'/contents/performance.json',{headers:{}});
        var perf={};
        if(rp.ok){
            var jp=await rp.json();
            perf=JSON.parse(decodeURIComponent(escape(atob(jp.content))));
        }
        window._CURRENT_PERF = perf;

        var MAPA_PERF = {
            "over_05_ht": "over_05_ht",
            "ambas_marcam": "ambas_marcam",
            "over_15_ft": "over_15_ft",
            "over_gol_partida": "over_gol_partida",
            "escanteio_ht": "escanteio_ht",
            "escanteio_ft": "escanteio_ft"
        };

        for(var cod in mercados){
            var perfKey = MAPA_PERF[cod] || cod;
            var p=perf[perfKey]||{green:0,red:0,total:0};
            var g=p.green||0,r2=p.red||0,t=p.total||0;
            var pct=t>0?(g/t*100).toFixed(1):'0.0';

            var pEl=document.getElementById('perf-'+cod);
            if(pEl){
                pEl.innerHTML='<div style="display:flex; justify-content:space-between; align-items:center;">'+
                    '<span>📊 '+t+'</span>'+
                    '<span style="color:#2ecc71;">🟢 '+g+'</span>'+
                    '<span style="color:#e74c3c;">🔴 '+r2+'</span>'+
                    '<span style="font-weight:bold; '+(parseFloat(pct)>=70?'color:#2ecc71;':'color:#e74c3c;')+'">'+pct+'%</span>'+
                    '</div>';
            }
        }
        if(!window._perfInterval){
            window._perfInterval=setInterval(carregarPerformance,30000);
        }
    }catch(e){
        console.error('Erro performance:', e.message);
    }
}
